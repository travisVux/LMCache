profiles:
  qwen3_14b:                             # MP default: MP/run.sh:54, engines/sglang.sh:5
    model: Qwen/Qwen3-14B
    kv_family: gqa
    gpus: 1
    tp: 1
    criteria: [lm_eval_samples_identical, lm_eval_score_drift, lm_eval_score_min]
    overrides: {}                        # lm_eval_score_min = default 0.80 [VERIFIED: no override set]

  dsv4_flash_tp4:
    model: deepseek-ai/DeepSeek-V4-Flash # MP/scripts/run-single-test.sh:113
    kv_family: sparse_mla_fp8
    gpus: 4
    tp: 4
    criteria: [byte_identical_greedy, retrieve_non_vacuous]
    tier: pr                             # today: PR (path filter). Proposal: nightly + matching paths [UNVERIFIED]

  kimi_linear_tp2:
    model: moonshotai/Kimi-Linear-48B-A3B-Instruct   # run-single-test.sh:107
    kv_family: hybrid_linear
    gpus: 2
    tp: 2
    criteria: [byte_identical_greedy, retrieve_non_vacuous]
    tier: pr                             # today; proposal: nightly

  qwen2_5_14b_correctness:
    model: Qwen/Qwen2.5-14B-Instruct     # correctness/scripts/run-correctness.sh:20
    gpus: 1
    criteria: [sharegpt_output_diff]

  opt125m_cpu:
    model: facebook/opt-125m
    kv_family: mha
    gpus: 0
    criteria: [cpu_e2e_outputs_identical]

  # XPU lane already uses small models (xpu/multiprocess/pipeline.yml:59-375):
  # Qwen3-0.6B / 1.7B / 8B, Qwen3.5-0.8B, yujiepan/kimi-linear-tiny-random, gemma-3-270m-it.
  # TODO (P6): small/dummy representatives per kv_family
  mla_dummy_small:
    model: TBD                           # e.g. DeepSeek-V2-Lite + --hf-overrides
    load_format: dummy
    hf_overrides: TBD
    kv_family: mla
    gpus: 1
    criteria: [byte_identical_greedy, retrieve_non_vacuous]

# ---------------------------------------------------------------------------
# 3. Tiers. Today: every K3 step is a PR step when paths match
#    (common_scripts/upload-pipeline.sh:40-60); `skip expensive ci` skips; `force-ci` forces.
#    Only nightly today: comprehensive baseline upload (NEED_UPLOAD) + vLLM/SGLang pin canary.
#    Below = PROPOSAL [UNVERIFIED]; #4861 maobaolong asked how to define "fast" and "required".
# ---------------------------------------------------------------------------
tiers:
  pr:          { budget_minutes: 15, layers: [unit, server_scenarios, cpu_e2e] }
  label_mp:    { layers: [real_engine_smoke_1gpu, small_model_layout_smoke] }
  nightly:     { layers: [full_tp, dual_engine_perf, engine_matrix, accuracy_sweep] }
  release:     { layers: [wheel_install_validation] }   # #4861 tier table

# ---------------------------------------------------------------------------
# 4. When relaxation is allowed, and when full testing is mandatory. [PROPOSAL]
# ---------------------------------------------------------------------------
relaxation:
  allowed_when:
    - change_class in [docs, tests_only]
    - change_class == core and server_scenarios == pass      # engine smoke skipped
    - perf criteria may use rolling_stored baseline instead of live_engine on PR tier,
      ONLY after on_missing_baseline becomes visible soft_fail (C11)
    - dummy weights allowed only for criteria with valid_with_dummy_weights: true
    - per-engine / per-capability thresholds only via `overrides` with source + reason (C2, C5, C6)
  never_relax:
    - exact criteria (byte_identical_greedy, preemption_sharegpt_exact, hma_bit_exact_logprobs) — no tolerance
    - score criteria on dummy weights
  full_required_when:
    - change_class in [deps_ci]          # requirements/, pyproject.toml, .buildkite/**, .github/**
    - change_class == kv_layout          # MLA/fp8/hybrid -> matching full-TP profile
    - label in [force-ci]                # existing: common_scripts/helpers.sh:60 ("full" label: proposal)
    - release branch or tag build
    - engine version pin change (vLLM/SGLang) # existing canary: MP/pipeline.yml:496, :528
  reporting:
    - verdict JSON must record attempt number (retry hides "1 of 3" passes, C12)
    - result shape compatible with #4861 result contract (capability, workload, commit, status, ...)
