# DRAFT — machine-readable acceptance config for LMCache GPU/E2E CI.
# Status: proposal for discussion (Issue #4861). NOT upstream.
# Values verified by P7 against LMCache dev @ fcd50cea (2026-11-04).
# Full inventory, blame and conflicts: outputs/P7/criteria_inventory.md
# Paths: MP = .buildkite/k3_tests/multiprocess, W = MP/scripts/workloads.
# Rule: env vars in scripts keep overriding these values (zero behavior change on adoption).
# Proposed upstream location: .buildkite/profiles/acceptance.yaml (matches #4861 layout;
#   per-machine overrides later move to .buildkite/profiles/executions/*/variants[].acceptance).
# Markers: [VERIFIED] = read in code at file:line. [UNVERIFIED] = proposal / not checked at runtime.

version: 0

# ---------------------------------------------------------------------------
# 1. What PASS means. One entry per criterion. `default` = value used today.
#    `overrides` match on engine / test / capability; first match wins.
# ---------------------------------------------------------------------------
criteria:

  # ---- exact / correctness ------------------------------------------------
  byte_identical_greedy:                 # [VERIFIED]
    kind: exact
    description: Cold-run output == LMCache-retrieve output (cmp -s), greedy.
    source: W/verification/l1-round-trip-verification.sh:114
    requires: [retrieve_non_vacuous]
    valid_with_dummy_weights: true       # KV round trip is weight-independent [UNVERIFIED: P6 to confirm per layout]
    used_by: [dsv4_flash_tp, kimi_linear_tp]   # MP/pipeline.yml:103, :228 ; vLLM + SGLang

  retrieve_non_vacuous:                  # [VERIFIED]
    kind: counter_increases
    description: LMCache retrieve/L1-read counter grows during the hit run.
    source:
      - W/verification/l1-round-trip-verification.sh:127-132
      - W/common/lm-eval.sh:255            # only when VERIFY_LMCACHE_RETRIEVAL=true
      - W/vllm/hma-lm-eval.sh:288-292
      - W/vllm/vllm-bench.sh:389-396
    valid_with_dummy_weights: true

  lm_eval_samples_identical:             # [VERIFIED]
    kind: exact
    description: Sorted gsm8k samples JSONL of run 1 == run 2 (diff -q).
    source: W/common/lm-eval.sh:94
    applies_when: LM_EVAL_VERIFY_MODE == samples   # default, MP/run.sh:26
    note: SCORE_MIN is NOT checked in this mode.
    valid_with_dummy_weights: false      # [UNVERIFIED] dummy output may be degenerate but still identical; keep false to be safe
    used_by: [lm_eval (vllm), xpu lm_eval_full_attn]

  lm_eval_score_drift:                   # [VERIFIED]
    kind: max_abs_diff
    default: 0.05                        # W/common/lm-eval.sh:19 (ea44ea7d, #4033)
    env: SCORE_TOLERANCE
    overrides:
      - { engine: sglang, test: lm_eval, value: 0.01, source: "MP/scripts/engines/sglang.sh:69 (#5298)" }
    # CONFLICT C1: MP/pipeline.yml:290 comment says "drift < 0.01" for lm_eval_preemption.
    #   Runtime value is 0.05: step env (MP/pipeline.yml:308-316) sets no SCORE_TOLERANCE,
    #   vllm.sh has no engine_configure_workload, SGLang blacklists lm_eval_preemption (sglang.sh:16-21).
    #   Both comment and 0.05 came in the same PR #4033. Maintainer must pick one; this file keeps 0.05.
    source: W/common/lm-eval.sh:175, :220
    valid_with_dummy_weights: false
    used_by: [lm_eval_preemption (vllm, 0.05), lm_eval (sglang, 0.01)]

  lm_eval_score_min:                     # [VERIFIED]
    kind: min
    default: 0.80                        # W/common/lm-eval.sh:20 ; MP/run.sh:27 (LM_EVAL_SCORE_MIN_DEFAULT) — duplicate C8
    env: SCORE_MIN                       # fallback LM_EVAL_SCORE_MIN_DEFAULT
    applies_when: LM_EVAL_VERIFY_MODE in [score, preemption]
    overrides: []                        # no step sets it today
    source: W/common/lm-eval.sh:177, :222
    valid_with_dummy_weights: false

  lm_eval_preemption_observed:           # [VERIFIED]
    kind: counter_increases
    description: Engine logs preemptions in both lm_eval runs.
    source: W/common/lm-eval.sh:179-182
    valid_with_dummy_weights: true       # [UNVERIFIED]

  hma_lm_eval_score_drift:               # [VERIFIED]
    kind: max_abs_diff
    default: 0                           # exact; W/vllm/hma-lm-eval.sh:41 (#3556)
    env: SCORE_TOLERANCE                 # CONFLICT C2: same env name as lm_eval_score_drift, different default
    overrides:
      - { test: hma_lm_eval_qwen3_5, value: 0.05, source: "MP/scripts/run-single-test.sh:100 (#3613)" }
    # C3: hma-lm-eval.sh:37-40 says "raise LIMIT rather than loosening this"; qwen3_5 loosens to 0.05 (GDN not bit-exact).
    source: W/vllm/hma-lm-eval.sh:283
    valid_with_dummy_weights: false
    used_by: [xpu lm_eval_gdn]           # MP hma_lm_eval_gemma4 disabled: MP/pipeline.yml:353

  hma_bit_exact_logprobs:                # [VERIFIED]
    kind: exact
    description: Prompt tokens and top-100 logprobs match exactly (cold vs GPU APC vs LMCache).
    source: W/vllm/hma_bit_correctness.py:65, :94-109, :262
    valid_with_dummy_weights: true       # [UNVERIFIED] xpu kimi lane already uses yujiepan/kimi-linear-tiny-random
    used_by: [xpu hma_kda_mla_correctness, hma_swa_correctness, hma_dsv4_correctness]

  preemption_sharegpt_exact:             # [VERIFIED]
    kind: diff_vs_reference
    max_different: 0
    max_only_in_one: 0
    requires: [ref_not_preempted, lmcache_rung_preempted_and_reloaded]   # preemption-correctness.sh:124-131, :206
    source: W/vllm/preemption-correctness.sh:168-176
    valid_with_dummy_weights: false
    used_by: [preemption_correctness]    # MP/pipeline.yml:328

  sharegpt_output_diff:                  # [VERIFIED]
    kind: diff_vs_no_cache
    max_different: 0
    max_only_in_one: 0
    source: .buildkite/k3_tests/correctness/scripts/run-correctness.sh:216
    extra: man_bash_half_prefix_exact    # run-correctness.sh:192
    attempts: 3                          # .buildkite/k3_tests/correctness/run.sh:27 (CORRECTNESS_MAX_ATTEMPTS) — C12: "1 of 3"
    valid_with_dummy_weights: false
    used_by: [k3-correctness-test]

  cpu_e2e_outputs_identical:             # [VERIFIED]
    kind: exact
    source: .github/scripts/run-cpu-e2e-validation.sh:868-880
    valid_with_dummy_weights: true
    used_by: [cpu_e2e_validation]        # MP/pipeline.yml:447

  restart_recovery_write_ratio:          # [VERIFIED] hardcoded
    kind: min_ratio
    default: 0.80
    source: W/common/restart-recovery.sh:294
    valid_with_dummy_weights: true       # [UNVERIFIED]

  # ---- performance --------------------------------------------------------
  ttft_speedup_vs_baseline:              # [VERIFIED]
    kind: max_slowdown_pct               # negative = LMCache must be faster by at least |value| %
    default: -60                         # W/common/long-doc-qa.sh:31 (#3405)
    env: MAX_TTFT_SLOWDOWN_PCT
    overrides:
      - { engine: sglang, value: 0, source: "MP/scripts/engines/sglang.sh:57" }
    # C5: XPU long_doc_qa (Qwen3-8B, 10 docs) uses the CUDA/Qwen3-14B value. XPU pass rate UNKNOWN.
    baseline: live_engine                # candidate: rolling_stored (WS-B)
    source: W/common/long-doc-qa.sh:226-229
    valid_with_dummy_weights: false

  round_time_speedup_vs_baseline:        # [VERIFIED]
    kind: max_slowdown_pct
    default: -15                         # W/common/long-doc-qa.sh:32 (#3405)
    env: MAX_ROUND_TIME_SLOWDOWN_PCT
    overrides:
      - { engine: sglang, value: 20, source: "MP/scripts/engines/sglang.sh:58" }
    baseline: live_engine
    valid_with_dummy_weights: false

  throughput_vs_baseline:                # [VERIFIED]
    kind: max_slowdown_pct
    default: 5                           # W/vllm/vllm-bench.sh:27
    env: MAX_SLOWDOWN_PERCENT
    overrides:
      - { capability: amd, value: 10, source: ".buildkite/scripts/amd-vllm-bench.sh:133 (#4641)" }
    baseline: live_engine                # candidate: rolling_stored (WS-B)
    retries: 3                           # MP/pipeline.yml:19-24
    valid_with_dummy_weights: false

  throughput_max_speedup_sanity:         # [VERIFIED] hardcoded, not env-overridable (C6)
    kind: max_speedup_pct
    default: 10
    source: W/vllm/vllm-bench.sh:195, fail at :216

  bench_input_tokens_tolerance:          # [VERIFIED] hardcoded
    kind: max_rel_diff
    default: 0.01
    source: W/vllm/vllm-bench.sh:136-148
    valid_with_dummy_weights: true

  l2_query_speedup:                      # [VERIFIED]
    kind: min_ratio
    default: 1.3
    env: MIN_L2_SPEEDUP
    source: [W/common/long-doc-qa-l2.sh:43, W/common/long-doc-qa-l2-verify.sh:28]   # duplicate C7
  l2_ttft_speedup:
    kind: min_ratio
    default: 1.5
    env: MIN_L2_TTFT_SPEEDUP
    source: [W/common/long-doc-qa-l2.sh:44, W/common/long-doc-qa-l2-verify.sh:29]
  l2_warmup_overhead:
    kind: max_ratio
    default: 1.2
    env: MAX_WARMUP_OVERHEAD
    source: [W/common/long-doc-qa-l2.sh:45, W/common/long-doc-qa-l2-verify.sh:30]

  rolling_worst_baseline:                # [VERIFIED]
    kind: max_slowdown_vs_rolling_worst
    window_days: 5                       # .buildkite/k3_tests/comprehensive/scripts/upload-baselines.sh:14 (prune)
    baseline_store: git branch benchmarks-main, benchmarks/inprocess/long_doc_qa/<feat>-YYYYMMDD.json
    adaptive_multiplier: "1.2 + 0.1 * max(0, 5 - N)"   # run-single-config.sh:388-391 ; N=5 -> 1.2x, N=1 -> 1.6x
    metrics_from: config checking-fields  # run-single-config.sh:246-257
    on_missing_baseline: pass            # run-single-config.sh:345-351 — C11, proposal: soft_fail + visible
    known_bugs:
      - C9 TTFT gate never enabled (looks for warmup_ttft_per_prompt, checks query_ttft) run-single-config.sh:254-257
      - C10 expected-latency-gain stripped, never checked (.buildkite/configs/local_cpu_with_v3.yaml:4)
    source: .buildkite/k3_tests/comprehensive/scripts/run-single-config.sh:328-421

  memory_leak_zero:                      # [VERIFIED]
    kind: exact
    source: .buildkite/k3_tests/comprehensive/scripts/run-single-config.sh:440-527
    skipped_for: [p2p, multi_device, layerwise]

  server_scenario_verdict:               # NEW (WS-A) [UNVERIFIED — not built yet]
    kind: all_checks_pass
    source: lmcache/cli/commands/bench/server_bench (planned)
    valid_with_dummy_weights: true

# ---------------------------------------------------------------------------
# 2. Model / case profiles (echo Issue #4861 models/ + executions/).
