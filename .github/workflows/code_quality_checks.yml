name: Code Quality

on:
  workflow_call:
  pull_request:

# Cancel older in-flight runs on the same PR / branch.
concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: read
    outputs:
      lmcache: ${{ github.event_name == 'release' || steps.filter.outputs.lmcache == 'true' }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        if: github.event_name == 'push'
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            lmcache:
              - '**'
              - '!operator/**'
              - '!.github/workflows/operator_*.yml'

  pre-commit:
    needs: changes
    if: needs.changes.outputs.lmcache == 'true'
    name: Check code quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
        - name: Harden Runner
          uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
          with:
            disable-sudo-and-containers: true
            egress-policy: audit

        - name: Checkout code
          uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
          with:
            # for setuptools-scm
            fetch-depth: 0

        - name: Setup Python 3.12 and 3.13
          uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
          with:
            python-version: |
              3.12
              3.13

        - run: echo "::add-matcher::.github/workflows/matchers/mypy.json"

        - name: Run code quality checks - lint, format, spell, & static checks
          uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
          with:
            extra_args: --all-files

        - name: "Fast Fail: Cancel sibling GHA runs and Buildkite CI"
          if: failure() && github.event_name == 'pull_request'
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            BK_TOKEN: ${{ secrets.BUILDKITE_API_TOKEN }}
            COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
            CURRENT_RUN_ID: ${{ github.run_id }}
          run: |
            python3 .buildkite/scripts/fast_fail_cancel.py \
              --commit "$COMMIT_SHA" \
              --current-run-id "$CURRENT_RUN_ID" \
              --reason "Code quality / lint checks failed on PR #${{ github.event.pull_request.number }}"


