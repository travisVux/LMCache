name: Code Quality

# PR CI runs in tiered layers:
#   Draft    test.yml on Python 3.12 only.
#   Ready    L1: Check code quality (pre-commit) and Resolve CI scope run in
#                parallel; Test (Python versions) + CPU device (OSes) start as
#                soon as Resolve CI scope finishes, running in parallel with
#                pre-commit. If pre-commit or Test fails, the run cancels.
#            Buildkite k3-unit-tests (1-GPU) builds ready-for-review commits
#                in parallel with this workflow; see its BK_WEB_SETUP.md.
# converted_to_draft starts a run that does nothing, so the concurrency group
# below cancels the in-flight ready-for-review run.
# PR-only: publish.yml runs the same pre-commit job from pre_commit.yml, so it
# does not inherit the permissions this layering needs.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# Cancel older in-flight runs on the same PR / branch.
concurrency:
  group: code-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-commit:
    name: Check code quality
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Detect changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lmcache:
              - '**'
              - '!operator/**'
              - '!.github/workflows/operator_*.yml'

      - name: Checkout code
        if: steps.filter.outputs.lmcache == 'true'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.12
        if: steps.filter.outputs.lmcache == 'true'
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: "3.12"

      - name: Add mypy matcher
        if: steps.filter.outputs.lmcache == 'true'
        run: echo "::add-matcher::.github/workflows/matchers/mypy.json"

      - name: Run code quality checks - lint, format, spell, & static checks
        if: steps.filter.outputs.lmcache == 'true'
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        with:
          extra_args: --all-files

  scope:
    name: Resolve CI scope
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      (github.base_ref == 'dev' || startsWith(github.base_ref, 'release-'))
    runs-on: ubuntu-24.04
    outputs:
      python_versions: ${{ steps.scope.outputs.python_versions }}
      cpu_os: ${{ steps.scope.outputs.cpu_os }}
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Checkout scope script
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          sparse-checkout: .github/scripts/pr-ci-scope.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Read the CI scope checklist
        id: scope
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/pr-ci-scope.sh

      - name: Warn if CI scope parsing failed
        if: steps.scope.outcome == 'failure'
        run: echo "::warning::pr-ci-scope.sh failed; falling back to full Test and CPU device matrices."

  # Reusable workflows called from here, since GitHub has no needs: across
  # workflows. Drafts skip pre-commit and scope, so the draft leg needs
  # !cancelled() to run past those skipped jobs; it passes an empty
  # python_versions and test.yml falls back to 3.12.
  # Ready PRs start Test and CPU device as soon as scope resolves (in parallel
  # with pre-commit) to cut L2 startup latency.
  test:
    name: Test
    needs: [scope]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.action != 'converted_to_draft' &&
      (github.base_ref == 'dev' || startsWith(github.base_ref, 'release-')) &&
      (github.event.pull_request.draft || needs.scope.result == 'success')
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/test.yml
    with:
      python_versions: ${{ needs.scope.outputs.python_versions }}
      force_rust: ${{ needs.scope.outputs.rust == 'true' }}

  cpu-device:
    name: CPU device
    needs: [scope]
    if: >-
      !cancelled() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.action != 'converted_to_draft' &&
      (github.base_ref == 'dev' || startsWith(github.base_ref, 'release-')) &&
      needs.scope.result == 'success'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/cpu_device.yml
    with:
      os: ${{ needs.scope.outputs.cpu_os }}
    secrets:
      hf_token: ${{ secrets.HF_TOKEN }}

  # When pre-commit or CPU unit tests fail, cancel this run so in-flight L2
  # runners are freed immediately. PRs from forks get a read-only token, so
  # they skip this.
  stop-on-failure:
    name: Stop remaining jobs (L1 or Test failed)
    needs: [pre-commit, test]
    if: >-
      !cancelled() &&
      (needs.pre-commit.result == 'failure' || needs.test.result == 'failure') &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Cancel this run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run cancel "${RUN_ID}" --repo "${REPO}"
