name: PR Full Build

# Build all release artifacts (sdist + CUDA wheel, CLI wheel, raw-block Rust
# module wheels, standard ROCm wheel, ROCm torch 2.10 wheel) on
# PRs carrying the `full` label.
# The `full` label is added automatically by automerge-labeler.yml when
# auto-merge is enabled on a code-change PR, so this acts as a pre-merge sanity
# check that wheels still build.
#
# The only tests here are the CPU unit-test Python versions that pre-review
# runs of test.yml skip. No code-quality checks, no publishing — those are
# covered by code_quality_checks.yml (per-PR) and publish.yml (on merge).

on:
    pull_request:
        branches:
            - dev
            - "release-**"
        types: [opened, synchronize, reopened, labeled, ready_for_review]

# Cancel older in-flight runs on the same PR. github.ref is
# refs/pull/<N>/merge on pull_request events, so each PR gets its own group.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    # Each build runs independently — a failure in one does not skip the
    # others, matching publish.yml's isolation model.

    build-main:
        name: Build main
        if: >-
            contains(github.event.pull_request.labels.*.name, 'full') &&
            github.event.pull_request.draft != true
        uses: ./.github/workflows/build_main_artifacts.yml

    build-cli:
        name: Build CLI
        if: >-
            contains(github.event.pull_request.labels.*.name, 'full') &&
            github.event.pull_request.draft != true
        uses: ./.github/workflows/build_cli_artifacts.yml

    build-raw-block:
        name: Build raw-block Rust module
        if: >-
            contains(github.event.pull_request.labels.*.name, 'full') &&
            github.event.pull_request.draft != true
        uses: ./.github/workflows/build_raw_block_artifacts.yml

    build-cpu:
        name: Build CPU
        if: >-
            contains(github.event.pull_request.labels.*.name, 'full') &&
            github.event.pull_request.draft != true
        uses: ./.github/workflows/build_cpu_artifacts.yml

    build-rocm:
        name: Build ROCm
        if: >-
            contains(github.event.pull_request.labels.*.name, 'full') &&
            github.event.pull_request.draft != true
        uses: ./.github/workflows/build_rocm_artifacts.yml
        secrets: inherit

    # Pre-review PR runs of test.yml cover Python 3.12 only; the other
    # supported versions run here once, before merge.
    test-deferred-python:
        name: Test deferred Python versions
        if: >-
            contains(github.event.pull_request.labels.*.name, 'full') &&
            github.event.pull_request.draft != true
        permissions:
            contents: read
            pull-requests: read
        uses: ./.github/workflows/test.yml
        with:
            deferred_python: true

    build-rocm-torch210:
        name: Build ROCm torch 2.10
        if: >-
            contains(github.event.pull_request.labels.*.name, 'full') &&
            github.event.pull_request.draft != true
        uses: ./.github/workflows/build_rocm_torch210_artifacts.yml
        secrets: inherit
