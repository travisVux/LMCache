name: Fast-Fail Cancel on Required CI Failure

# Centralised, fork-PR-safe cross-pipeline cancellation running in the trusted
# base-repo context:
# 1. workflow_run on "Code Quality": inspects job-level failures so only
#    required jobs ("Check code quality" / "Test / *") cancel siblings, while
#    flaky "CPU Device" failures (handled by cpu_device_rerun.yml) do not.
# 2. status on Buildkite required contexts ("buildkite/k3-unit-tests",
#    "buildkite/k3-multiprocess-smoke"): cancels sibling GHA runs and Buildkite
#    PR builds without storing Buildkite/GitHub write tokens on Buildkite pods.

on:
  workflow_run:
    workflows: ["Code Quality"]
    types: [completed]
  status:

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  cancel-on-code-quality-failure:
    name: Cancel sibling PR CI (Code Quality failed)
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["failure","cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Check if a required Code Quality job failed
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          failed_count="$(
            gh api --paginate \
              "repos/${REPO}/actions/runs/${RUN_ID}/attempts/${RUN_ATTEMPT}/jobs" \
              --jq '[.jobs[] | select(.conclusion == "failure") | select(.name == "Check code quality" or (.name | startswith("Test / ")))] | length' \
              | awk '{s+=$1} END {print s+0}'
          )"
          echo "Required failed job count: ${failed_count}"
          if [[ "${failed_count}" -gt 0 ]]; then
            echo "fire=true" >> "${GITHUB_OUTPUT}"
          else
            echo "fire=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Checkout fast_fail_cancel.py
        if: steps.gate.outputs.fire == 'true'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          sparse-checkout: .buildkite/scripts/fast_fail_cancel.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Cancel sibling GHA runs and Buildkite PR builds
        if: steps.gate.outputs.fire == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDKITE_API_TOKEN: ${{ secrets.BUILD_KITE_API_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_num="${PR_NUMBER}"
          if [[ -z "${pr_num}" ]]; then
            pr_num="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" --jq '[.[] | select(.state == "open" and .head.repo.full_name == env.HEAD_REPO)][0].number // empty')"
          fi
          args=(
            --commit "${HEAD_SHA}"
            --repo "${REPO}"
            --head-repo "${HEAD_REPO}"
            --head-branch "${HEAD_BRANCH}"
            --current-run-id "${RUN_ID}"
            --reason "Required workflow 'Code Quality' failed (run ${RUN_ID})"
          )
          if [[ -n "${pr_num}" ]]; then
            args+=(--pr-number "${pr_num}")
          fi
          python3 .buildkite/scripts/fast_fail_cancel.py "${args[@]}"

  cancel-on-buildkite-required-failure:
    name: Cancel sibling PR CI (Buildkite required failed)
    if: >-
      github.event_name == 'status' &&
      github.event.state == 'failure' &&
      (
        github.event.context == 'buildkite/k3-unit-tests' ||
        github.event.context == 'buildkite/k3-multiprocess-smoke'
      )
    runs-on: ubuntu-24.04
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76 # v2.14.0
        with:
          disable-sudo-and-containers: true
          egress-policy: audit

      - name: Resolve open PR for failed commit
        id: resolve-pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_json="$(gh api "repos/${REPO}/commits/${HEAD_SHA}/pulls" --jq '[.[] | select(.state == "open")][0] // empty')"
          if [[ -z "${pr_json}" ]]; then
            echo "No open PR for ${HEAD_SHA}; skipping fast-fail cancellation."
            echo "has_pr=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "has_pr=true" >> "${GITHUB_OUTPUT}"
          echo "pr_number=$(jq -r '.number' <<< "${pr_json}")" >> "${GITHUB_OUTPUT}"
          echo "head_repo=$(jq -r '.head.repo.full_name // empty' <<< "${pr_json}")" >> "${GITHUB_OUTPUT}"
          echo "head_branch=$(jq -r '.head.ref // empty' <<< "${pr_json}")" >> "${GITHUB_OUTPUT}"

      - name: Checkout fast_fail_cancel.py
        if: steps.resolve-pr.outputs.has_pr == 'true'
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          sparse-checkout: .buildkite/scripts/fast_fail_cancel.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Cancel sibling GHA runs and Buildkite PR builds
        if: steps.resolve-pr.outputs.has_pr == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILDKITE_API_TOKEN: ${{ secrets.BUILD_KITE_API_TOKEN }}
          HEAD_SHA: ${{ github.event.sha }}
          PR_NUMBER: ${{ steps.resolve-pr.outputs.pr_number }}
          HEAD_REPO: ${{ steps.resolve-pr.outputs.head_repo }}
          HEAD_BRANCH: ${{ steps.resolve-pr.outputs.head_branch }}
          CONTEXT: ${{ github.event.context }}
          TARGET_URL: ${{ github.event.target_url }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 .buildkite/scripts/fast_fail_cancel.py \
            --commit "${HEAD_SHA}" \
            --pr-number "${PR_NUMBER}" \
            --repo "${REPO}" \
            --head-repo "${HEAD_REPO}" \
            --head-branch "${HEAD_BRANCH}" \
            --reason "Required pipeline ${CONTEXT} failed (${TARGET_URL})"
