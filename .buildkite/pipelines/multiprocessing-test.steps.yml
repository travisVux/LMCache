env:
  DOCKER_BUILDKIT: 1

steps:
  - label: ":compression: Multiprocessing tests / {{matrix.request_transport}}"
    key: "test"
    cancel_on_build_failing: true
    timeout_in_minutes: 60
    matrix:
      setup:
        request_transport:
          - "zmq"
    env: { LMCACHE_REQUEST_TRANSPORT: "{{matrix.request_transport}}" }
    command: |
      set -euo pipefail
      source .buildkite/k3_tests/common_scripts/helpers.sh
      if should_skip_expensive_multiprocess_pipeline; then
        echo "Skipping multiprocessing tests for a 'skip expensive ci' PR. Add force-ci to run the full suite."
        exit 0
      fi
      merge_pr_base_branch
      .buildkite/scripts/should-run-expensive-tests.sh || exit 0
      chmod +x .buildkite/scripts/multiprocessing-test/*.sh
      BUILD_ID=${BUILDKITE_BUILD_ID} .buildkite/scripts/multiprocessing-test/run-mp-test.sh

  - label: ":skull: Fast Fail: Cancel sibling CI"
    depends_on: "test"
    allow_dependency_failure: true
    if: build.state == "failing" || build.state == "failed"
    command: |
      python3 .buildkite/scripts/fast_fail_cancel.py \
        --commit "$$BUILDKITE_COMMIT" \
        --current-build-id "$$BUILDKITE_BUILD_ID" \
        --reason "Multiprocessing test failed in build $$BUILDKITE_BUILD_NUMBER"

