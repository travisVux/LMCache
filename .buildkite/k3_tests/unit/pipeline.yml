# Unit tests — runs pytest with coverage against LMCache source.
# No vLLM required; uses setup-lmcache-only-env.sh for a lighter install.

steps:
  - label: ":test_tube: Unit Tests"
    key: "unit_test"
    command: .buildkite/k3_tests/unit/run.sh
    timeout_in_minutes: 60
    agents: { queue: "k8s" }
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - name: container-0
                image: lmcache/ci-base:latest
                imagePullPolicy: Never
                env:
                  - { name: CUDA_LAUNCH_BLOCKING, value: "1" }
                resources:
                  requests:
                    cpu: "32"
                    memory: "96Gi"
                  limits:
                    nvidia.com/gpu: "1"
                    cpu: "64"
                    memory: "200Gi"
                volumeMounts:
                  - { name: hf-cache, mountPath: /root/.cache/huggingface }
                  # K8s defaults /dev/shm to 64 MiB, which causes SIGBUS in
                  # tests/inprocess/v1/storage_backend/shm_allocator (allocates 5 GiB via SharedMemory).
                  # Mount a 16 GiB tmpfs to give shm tests headroom.
                  - { name: dshm, mountPath: /dev/shm }
                  # GDS-capable scratch dir on the host's local NVMe. Direct
                  # hostPath (no subPath) — K8s' subPath bind-mount breaks
                  # cuFile's fs-type detection. run.sh creates a per-build
                  # subdir here and exposes it via LMCACHE_TEST_TMPDIR.
                  - { name: scratch, mountPath: /scratch }
            volumes:
              - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
              - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 16Gi } }
              - { name: scratch, hostPath: { path: /data/gds-scratch, type: DirectoryOrCreate } }
    artifact_paths:
      - "durations/test.html"
      - "coverage-test.xml"
      - "coverage-test/**/*"

  - label: ":skull: Fast Fail: Cancel Sibling CI"
    depends_on: "unit_test"
    allow_dependency_failure: true
    if: build.state == "failing" || build.state == "failed"
    command: |
      python3 .buildkite/scripts/fast_fail_cancel.py \
        --commit "$$BUILDKITE_COMMIT" \
        --current-build-id "$$BUILDKITE_BUILD_ID" \
        --reason "Unit tests failed in build $$BUILDKITE_BUILD_NUMBER"
    timeout_in_minutes: 5
    agents: { queue: "k8s" }
    plugins:
      - kubernetes:
          podSpec:
            containers:
              - name: container-0
                image: lmcache/ci-base:latest
                imagePullPolicy: Never
                env:
                  - name: GITHUB_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: buildkite-git-creds
                        key: GITHUB_TOKEN
                  - name: BUILDKITE_API_TOKEN
                    valueFrom:
                      secretKeyRef:
                        name: buildkite-api-token
                        key: token
                        optional: true

