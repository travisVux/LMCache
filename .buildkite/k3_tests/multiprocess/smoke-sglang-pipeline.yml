# PR-smoke SGLang multiprocess tier (follow-up to LM-1131):
# Selected automatically by upload-pipeline.sh when a PR diff touches SGLang
# integration, test, or CI files; otherwise smoke-pipeline.yml (vLLM) runs.

x-flaky-retry: &flaky-retry
  automatic:
    - exit_status: -1
      limit: 2
    - exit_status: "*"
      limit: 2

x-pod-1gpu: &pod-1gpu
  containers:
    - name: container-0
      image: lmcache/ci-base:latest
      imagePullPolicy: Never
      resources: { limits: { "nvidia.com/gpu": "1" } }
      volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
        - { name: dshm, mountPath: /dev/shm }
  volumes:
    - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
    - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 1Gi } }

x-pod-1gpu-dshm: &pod-1gpu-dshm
  containers:
    - name: container-0
      image: lmcache/ci-base:latest
      imagePullPolicy: Never
      resources: { limits: { "nvidia.com/gpu": "1" } }
      volumeMounts:
        - { name: hf-cache, mountPath: /root/.cache/huggingface }
        - { name: dshm, mountPath: /dev/shm }
  volumes:
    - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
    - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 128Gi } }

steps:
  - group: ":zap: Multiprocess PR-Smoke SGLang (1-GPU)"
    steps:
      - label: ":zap: sglang / lm_eval_lmcache_driven / zmq"
        command: .buildkite/k3_tests/multiprocess/run.sh lm_eval
        env:
          INFERENCE_ENGINE: "sglang"
          LMCACHE_REQUEST_TRANSPORT: "zmq"
        timeout_in_minutes: 30
        retry: *flaky-retry
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu-dshm } }]
        artifact_paths: ["*.log"]

      - label: ":zap: sglang / restart_recovery / zmq"
        command: .buildkite/k3_tests/multiprocess/run.sh restart_recovery
        env:
          INFERENCE_ENGINE: "sglang"
          LMCACHE_REQUEST_TRANSPORT: "zmq"
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

      - label: ":zap: sglang / http_api / zmq"
        command: .buildkite/k3_tests/multiprocess/run.sh http_api
        env:
          INFERENCE_ENGINE: "sglang"
          LMCACHE_REQUEST_TRANSPORT: "zmq"
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins: [{ kubernetes: { podSpec: *pod-1gpu } }]
        artifact_paths: ["*.log"]

  - group: ":zap: Multiprocess PR-Smoke (CPU E2E)"
    steps:
      - label: ":zap: cpu_e2e_validation ({{matrix.mode}} / {{matrix.request_transport}})"
        command: |
          case "{{matrix.mode}}" in
            shm) ;;
            inline) export LMCACHE_SHM_NAME="" ;;
            server_copy) export LMCACHE_MP_TRANSFER_MODE="lmcache_driven" ;;
          esac
          bash .github/scripts/run-cpu-e2e-validation.sh
        matrix:
          setup:
            mode:
              - "shm"
              - "inline"
              - "server_copy"
            request_transport:
              - "zmq"
        env: { LMCACHE_REQUEST_TRANSPORT: "{{matrix.request_transport}}" }
        timeout_in_minutes: 30
        agents: { queue: "k8s" }
        plugins:
          - kubernetes:
              podSpec:
                containers:
                  - name: container-0
                    image: lmcache/ci-base:latest
                    imagePullPolicy: Never
                    resources:
                      requests:
                        cpu: "8"
                        memory: "256Gi"
                      limits:
                        cpu: "8"
                        memory: "256Gi"
                    volumeMounts:
                      - { name: hf-cache, mountPath: /root/.cache/huggingface }
                      - { name: dshm, mountPath: /dev/shm }
                volumes:
                  - { name: hf-cache, hostPath: { path: /data/huggingface, type: DirectoryOrCreate } }
                  - { name: dshm, emptyDir: { medium: Memory, sizeLimit: 4Gi } }

  - wait: ~
    if: build.pull_request.labels includes 'force-ci'

  - trigger: "k3-multiprocess-test"
    label: ":rocket: Trigger heavy multiprocess tier (force-ci)"
    if: build.pull_request.labels includes 'force-ci'
    async: false
    build:
      commit: "${BUILDKITE_COMMIT}"
      branch: "${BUILDKITE_BRANCH}"
      message: "${BUILDKITE_MESSAGE}"
      env:
        BUILDKITE_PULL_REQUEST: "${BUILDKITE_PULL_REQUEST:-false}"
        BUILDKITE_PULL_REQUEST_BASE_BRANCH: "${BUILDKITE_PULL_REQUEST_BASE_BRANCH:-dev}"
        BUILDKITE_PULL_REQUEST_LABELS: "${BUILDKITE_PULL_REQUEST_LABELS:-}"
